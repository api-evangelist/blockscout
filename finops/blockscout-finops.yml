specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Blockscout
providerId: blockscout
created: '2026-05-08'
modified: '2026-05-08'
reconciled: true
tags:
  - Web3
  - Explorer
  - FinOps
  - FOCUS
description: >-
  FinOps view of Blockscout. Three cost models: free / self-host (OSS), hosted PRO API on
  dev.blockscout.com (subscription with credit allowance), and Explorer-as-a-Service (managed
  hosting). Per-chain public instances are typically free.
sources:
  - https://dev.blockscout.com/pricing
  - https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Blockscout
serviceCategory: Crypto Explorer
billingModel:
  pricingCategory: Subscription with Metered Credit Allowance
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Subscription
    - Usage
focusColumns:
  ServiceName: Blockscout PRO API
  ServiceCategory: Crypto Explorer
  ProviderName: Blockscout
  PublisherName: Blockscout
  InvoiceIssuerName: Blockscout
  BillingCurrency: USD
  ChargeCategory: Subscription
meters:
  - name: pro_subscription
    description: Monthly PRO subscription per API key.
    unit: month
    aggregation: sum
    dimensions:
      - api_key
  - name: pro_credits
    description: Per-call credit consumption against monthly allowance.
    unit: credit
    aggregation: sum
    dimensions:
      - api_key
      - chain
      - endpoint
  - name: eaas_subscription
    description: Explorer-as-a-Service managed-instance subscription.
    unit: month
    aggregation: sum
    dimensions:
      - chain
principles:
  - name: Visibility
    description: Track per-endpoint credit consumption and per-chain EaaS costs.
  - name: Allocation
    description: Allocate PRO subscription per API key; allocate EaaS per chain.
  - name: Optimization
    description: Self-host where chain volume justifies; use PRO for breadth across chains.
  - name: Accountability
    description: Assign a billing owner per PRO key and per managed instance.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
