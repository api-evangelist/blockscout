description: >-
  The Blockscout PRO API at api.blockscout.com is gated with x402: an unauthenticated request
  returns HTTP 402 with a base64 `payment-required` header carrying the payment requirements,
  and the JSON body "Proceed with API key or make a X402 payment to continue". An agent can
  therefore pay per call in USDC on Base without holding an account or an API key.
