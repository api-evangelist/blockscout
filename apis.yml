  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://eth.blockscout.com/api/v2
  humanURL: https://docs.blockscout.com/devs/apis/rest
  description: >-
    Recommended REST API on each Blockscout instance. Endpoints cover blocks, transactions, addresses,
    tokens, smart-contract verification, and more. Path varies by chain (eth, optimism, base, etc.). Free
    for self-hosted; subject to PRO API plans on dev.blockscout.com.
  properties:
  - type: Documentation
    url: https://docs.blockscout.com/devs/apis/rest
  x-features:
