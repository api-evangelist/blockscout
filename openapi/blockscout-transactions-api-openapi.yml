  schemas:
    TotalERC20:
      required:
      - decimals
      - value
      properties:
        decimals:
          type: string
          example: '18'
        value:
          type: string
          example: '1000'
    DecodedInput:
      type: object
      required:
      - method_call
      - method_id
      - parameters
      properties:
        method_call:
          type: string
          example: transferFrom(address _from, address _to, uint256 _value)
        method_id:
          type: string
          example: 23b872dd
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/DecodedInputParameter'
    TransactionSummary:
      type: object
      required:
      - success
      - data
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/TransactionSummaryObj'
    DecodedInputLog:
      type: object
      required:
      - method_call
      - method_id
      - parameters
      properties:
        method_call:
          type: string
          example: transferFrom(address _from, address _to, uint256 _value)
        method_id:
          type: string
          example: 23b872dd
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/DecodedInputLogParameter'
    Transaction:
      type: object
      required:
      - timestamp
      - fee
      - gas_limit
      - block_number
      - status
      - method
      - confirmations
      - type
      - exchange_rate
      - to
      - transaction_burnt_fee
      - max_fee_per_gas
      - result
      - hash
      - gas_price
      - priority_fee
      - base_fee_per_gas
      - from
      - token_transfers
      - transaction_types
      - gas_used
      - created_contract
      - position
      - nonce
      - has_error_in_internal_transactions
      - actions
      - decoded_input
      - token_transfers_overflow
      - raw_input
      - value
      - max_priority_fee_per_gas
      - revert_reason
      - confirmation_duration
      - transaction_tag
      properties:
        timestamp:
          type: string
          example: '2022-08-02T07:18:05.000000Z'
        fee:
          $ref: '#/components/schemas/Fee'
        gas_limit:
          type: integer
        block_number:
          type: integer
          format: int32
          example: 23484035
        status:
          type: string
          example: ok | error
        method:
          type: string
          example: transferFrom
        confirmations:
          type: integer
          example: 1035
        type:
          type: integer
          example: 2
        exchange_rate:
          type: string
          example: '1866.51'
        to:
          nullable: true,
          $ref: '#/components/schemas/AddressParam'
        transaction_burnt_fee:
          type: string
          example: '1099596081903840'
        max_fee_per_gas:
          type: string
          example: '55357460102'
        result:
          type: string
          example: 'Error: (Awaiting internal transactions for reason)'
        hash:
          type: string
          example: '0x5d90a9da2b8da402b11bc92c8011ec8a62a2d59da5c7ac4ae0f73ec51bb73368'
        gas_price:
          type: string
          example: '26668595172'
        priority_fee:
          type: string
          example: '2056916056308'
        base_fee_per_gas:
          type: string
          example: '26618801760'
        from:
          $ref: '#/components/schemas/AddressParam'
        token_transfers:
          type: array
          items:
            $ref: '#/components/schemas/TokenTransfer'
        transaction_types:
          type: array
          items:
            type: string
          example:
          - token_transfer
          - contract_creation
          - contract_call
          - token_creation
          - coin_transfer
        gas_used:
          type: string
          example: '41309'
        created_contract:
          nullable: true,
          $ref: '#/components/schemas/AddressParam'
        position:
          type: integer
          example: 117
        nonce:
          type: integer
          example: 115
        has_error_in_internal_transactions:
          type: boolean
          example: false
        actions:
          type: array
          items:
            $ref: '#/components/schemas/TransactionAction'
        decoded_input:
          $ref: '#/components/schemas/DecodedInput'
        token_transfers_overflow:
          type: boolean
          example: false
        raw_input:
          type: string
          example: '0xa9059cbb000000000000000000000000ef8801eaf234ff82801821ffe2d78d60a0237f97000000000000000000000000000000000000000000000000000000003178cb80'
        value:
          type: string
          example: '0'
        max_priority_fee_per_gas:
          type: string
          example: '49793412'
        revert_reason:
          type: string
          example: 'Error: (Awaiting internal transactions for reason)'
        confirmation_duration:
          type: object
          example:
          - 0
          - 17479.0
        transaction_tag:
          type: string
          example: private_transaction_tag
    SummaryVariableCurrency:
      type: object
      required:
      - type
      - value
      properties:
        type:
          type: string
          example: currency
          description: Currency type
        value:
          type: string
          example: '0.195999999980484004'
          description: Value
    TransactionActionUniswapV3MintNFT:
      required:
      - data
      - protocol
      - type
      properties:
        data:
          type: object
          example:
            name: 'Uniswap V3: Positions NFT'
            symbol: UNI-V3-POS
            address: '0x1F98431c8aD98523631AE4a59f267346ea31F984'
            to: '0x7Fc66500c84A76Ad7e9c93437bFc5Ac33E2DDaE9'
            ids:
            - '1'
            - '2'
            block_number: 1
        protocol:
          type: string
          example: uniswap_v3
        type:
          type: string
          example: mint_nft
    RawTraceCreateAction:
      type: object
      required:
      - from
      - gas
      - init
      - value
      properties:
        from:
          type: string
          example: '0xf57b55b01b831e602e09674a4e5d69cbcf343f98'
        gas:
          type: string
          example: '0x25D3FC'
        init:
          type: string
          example: ''
        value:
          type: string
          example: '0x0'
    RawTraceCreateResult:
      type: object
      required:
      - address
      - code
      - gasUsed
      properties:
        address:
          type: string
          example: '0xf57b55b01b831e602e09674a4e5d69cbcf343f98'
        code:
          type: string
          example: '0x25D3FC'
        gasUsed:
          type: string
          example: '0x25D3FC'
    InternalTransaction:
      type: object
      required:
      - block_number
      - created_contract
      - error
      - from
      - gas_limit
      - index
      - success
      - timestamp
      - to
      - transaction_hash
      - type
      - value
      properties:
        block_number:
          type: integer
          example: 8844586
        created_contract:
          $ref: '#/components/schemas/AddressParam'
        error:
          type: string
          example: reverted
        from:
          $ref: '#/components/schemas/AddressParam'
        gas_limit:
          type: string
          example: '351759'
        index:
          type: integer
          example: 1
        success:
          type: boolean
          example: true
        timestamp:
          type: string
          example: '2023-04-17T10:37:12.000000Z'
        to:
          $ref: '#/components/schemas/AddressParam'
        transaction_hash:
          type: string
          example: '0x08ea4d75ad0abe327a7fd368733eaeac43077989e635d800530d7906ebf3bd54'
        type:
          type: string
          example: call
        value:
          type: string
          example: '30000000000000000'
    RawTraceSelfDestructAction:
      type: object
      required:
      - address
      - balance
      - refundAddress
      properties:
        address:
          type: string
          example: '0xf57b55b01b831e602e09674a4e5d69cbcf343f98'
        balance:
          type: string
          example: '0x25D3FC'
        refundAddress:
          type: string
          example: '0x162e898bd0aacb578c8d5f8d6ca588c13d2a383f'
    Summary:
      type: object
      required:
      - summary_template
      - summary_template_variables
      properties:
        summary_template:
          type: string
          example: '{action_type} of {amount} {token}'
          description: Summary template
        summary_template_variables:
          $ref: '#/components/schemas/SummaryTemplateVariables'
          description: Variables for summary
    NFTChange:
      required:
      - direction
      - total
      properties:
        direction:
          type: string
          example: from | to
        total:
          $ref: '#/components/schemas/TotalERC721'
    TotalERC1155:
      required:
      - token_id
      - decimals
      - value
      properties:
        token_id:
          type: string
          example: '1'
        decimals:
          type: string
          example: null
        value:
          type: string
          example: '1000'
        token_instance:
          $ref: '#/components/schemas/NFTInstance'
    TransactionActionAaveV3BSWRF:
      required:
      - data
      - protocol
      - type
      properties:
        data:
          type: object
          example:
            amount: '1.289548595490270429'
            symbol: AAVE
            address: '0x7Fc66500c84A76Ad7e9c93437bFc5Ac33E2DDaE9'
            block_number: 1
        protocol:
          type: string
          example: aave_v3
        type:
          type: string
          example: borrow | supply | withdraw | repay | flash_loan
    TokenInfoDetailed:
      type: object
      required:
      - address
      - circulating_market_cap
      - decimals
      - exchange_rate
      - holders
      - icon_url
      - name
      - symbol
      - total_supply
      - type
      - volume_24h
      properties:
        address_hash:
          type: string
          example: '0xBEEF69Ac7870777598A04B2bd4771c71212E6aBc'
          description: Token Address
        circulating_market_cap:
          type: string
          example: '0.0'
          description: Token circulating market cap
        decimals:
          type: string
          example: '18'
          description: Token decimals
        exchange_rate:
          type: string
          example: '2890.96'
          description: Token exchange rate
        holders_count:
          type: string
          example: '2999'
          description: Token holders amount
        icon_url:
          type: string
          example: https://assets.coingecko.com/coins/images/39410/small/Steakhouse_logo-05.jpg?1722053893
          description: 'Token image URL '
        name:
          type: string
          example: Steakhouse Resteaking Vault
          description: Token name
        symbol:
          type: string
          example: steakLRT
          description: Token symbol
        total_supply:
          type: string
          example: '9710057205959239302188'
          description: Token total supply
        type:
          type: string
          example: ERC-20
          description: Token type
        volume_24h:
          type: string
          example: '24298.765344836862'
          description: Token trading volume for past 24h
    TokenTransfer:
      type: object
      required:
      - block_hash
      - from
      - log_index
      - to
      - token
      - total
      - transaction_hash
      - type
      properties:
        block_hash:
          type: string
          example: '0xf569ec751152b2f814001fc730f7797aa155e4bc3ba9cb6ba24bc2c8c9468c1a'
        from:
          $ref: '#/components/schemas/AddressParam'
        log_index:
          type: integer
          example: 16
        method:
          type: string
          example: transfer
        timestamp:
          type: string
          example: '2023-07-03T20:09:59.000000Z'
        to:
          $ref: '#/components/schemas/AddressParam'
        token:
          $ref: '#/components/schemas/TokenInfo'
        total:
          oneOf:
          - $ref: '#/components/schemas/TotalERC20'
          - $ref: '#/components/schemas/TotalERC721'
          - $ref: '#/components/schemas/TotalERC1155'
        transaction_hash:
          type: string
          example: '0x6662ad1ad2ea899e9e27832dc202fd2ef915a5d2816c1142e6933cff93f7c592'
        type:
          type: string
          example: token_transfer
    WatchlistName:
      type: object
      required:
      - display_name
      - label
      properties:
        display_name:
          type: string
          example: name to show
        label:
          type: string
          example: label
    RawTrace:
      type: object
      required:
      - action
      - subtraces
      - traceAddress
      - type
      properties:
        action:
          oneOf:
          - $ref: '#/components/schemas/RawTraceCallAction'
          - $ref: '#/components/schemas/RawTraceCreateAction'
          - $ref: '#/components/schemas/RawTraceSelfDestructAction'
        subtraces:
          type: integer
          example: 0
        traceAddress:
          type: array
          items:
            type: integer
          example:
          - 0
          - 0
        type:
          type: string
          example: call
        error:
          type: string
          example: Reverted
        result:
          oneOf:
