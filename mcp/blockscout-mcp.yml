tools_count: 16
tools:
- name: __unlock_blockchain_analysis__
  description: "Initializes a Blockscout MCP session: returns server reference data, the\n    `blockscout-analysis`\
    \ skill pointer, and the URI resolution rule. Call this tool\n    exactly once per session, before\
    \ any other tool, and reuse its payload for the\n    rest of the session; do not call it again."
- name: get_block_info
  description: "Get block information like timestamp, gas used, burnt fees, transaction count etc.\n \
    \   Can optionally include the list of transaction hashes contained in the block. Transaction hashes\
    \ are omitted by default; request them only when you truly need them, because on high-traffic chains\
    \ the list may exhaust the context."
- name: get_block_number
  description: "Retrieves the block number and timestamp for a specific date/time or the latest block.\n\
    \    Use when you need a block height for a specific point in time (e.g., \"block at 2024-01-01\"\
    )\n    or the current chain tip. If `datetime` is provided, finds the block immediately\n    preceding\
    \ that time. If omitted, returns the latest indexed block."
- name: get_address_by_ens_name
  description: "Useful for when you need to convert an ENS domain name (e.g. \"blockscout.eth\")\n   \
    \ to its corresponding Ethereum address."
- name: get_transactions_by_address
  description: "Retrieves native currency transfers and smart contract interactions (calls, internal txs)\
    \ for an address.\n    **EXCLUDES TOKEN TRANSFERS**: Filters out direct token balance changes (ERC-20,\
    \ etc.). You'll see calls *to* token contracts, but not the `Transfer` events. For token history,\
    \ use `get_token_transfers_by_address`.\n    A single tx can have multiple records from internal calls.\n\
    \    Requires an `age_from` date to scope results for performance and relevance.\n    **SUPPORTS PAGINATION**:\
    \ If response includes 'pagination' field, use the provided next_call to get additional pages."
- name: get_token_transfers_by_address
  description: "Get ERC-20 token transfers for an address within a specific time range.\n    **SUPPORTS\
    \ PAGINATION**: If response includes 'pagination' field, use the provided next_call to get additional\
    \ pages."
- name: lookup_token_by_symbol
  description: "Search for token addresses by symbol or name. Returns multiple potential\n    matches\
    \ based on symbol or token name similarity. Only the first\n    7 matches from the Blockscout API\
    \ are returned."
- name: get_contract_abi
  description: "Get smart contract ABI (Application Binary Interface).\n    An ABI defines all functions,\
    \ events, their parameters, and return types. The ABI is required to format function calls or interpret\
    \ contract data."
- name: inspect_contract_code
  description: Inspects a verified contract's source code or metadata.
- name: read_contract
  description: "Calls a smart contract function (view/pure, or non-view/pure simulated via eth_call) and\
    \ returns the\n        decoded result.\n\n        This tool provides a direct way to query the state\
    \ of a smart contract.\n\n        Example:\n        To check the USDT balance of an address on Ethereum\
    \ Mainnet, you would use the following arguments:\n    {\n      \"tool_name\": \"read_contract\",\n\
    \      \"params\": {\n        \"chain_id\": \"1\",\n        \"address\": \"0xdAC17F958D2ee523a2206206994597C13D831ec7\"\
    ,\n        \"abi\": {\n          \"constant\": true,\n          \"inputs\": [{\"name\": \"_owner\"\
    , \"type\": \"address\"}],\n          \"name\": \"balanceOf\",\n          \"outputs\": [{\"name\"\
    : \"balance\", \"type\": \"uint256\"}],\n          \"payable\": false,\n          \"stateMutability\"\
    : \"view\",\n          \"type\": \"function\"\n        },\n        \"function_name\": \"balanceOf\"\
    ,\n        \"args\": \"[\"0xF977814e90dA44bFA03b6295A0616a897441aceC\"]\"\n      }\n    }"
- name: get_address_info
  description: "Get comprehensive information about an address, including:\n    - Address existence check\n\
    \    - Native token (ETH) balance (provided as is, without adjusting by decimals)\n    - First transaction\
    \ details (block number and timestamp) for age calculation\n    - ENS name association (if any)\n\
    \    - Contract status (whether the address is a contract, whether it is verified)\n    - Proxy contract\
    \ information (if applicable): determines if a smart contract is a proxy contract (which forwards\
    \ calls to implementation contracts), including proxy type and implementation addresses\n    - Token\
    \ details (if the contract is a token): name, symbol, decimals, total supply, etc.\n    Essential\
    \ for address analysis, contract investigation, token research, and DeFi protocol analysis."
- name: get_tokens_by_address
  description: "Get comprehensive ERC20 token holdings for an address with enriched metadata and market\
    \ data.\n    Returns detailed token information including contract details (name, symbol, decimals),\
    \ market metrics (exchange rate, market cap, volume), holders count, and actual balance (provided\
    \ as is, without adjusting by decimals).\n    Essential for portfolio analysis, wallet auditing, and\
    \ DeFi position tracking.\n    **SUPPORTS PAGINATION**: If response includes 'pagination' field, use\
    \ the provided next_call to get additional pages."
- name: nft_tokens_by_address
  description: "Retrieve NFT tokens (ERC-721, ERC-404, ERC-1155) owned by an address, grouped by collection.\n\
    \    Provides collection details (type, address, name, symbol, total supply, holder count) and individual\
    \ token instance data (ID, name, description, external URL, metadata attributes).\n    Essential for\
    \ a detailed overview of an address's digital collectibles and their associated collection data.\n\
    \    **SUPPORTS PAGINATION**: If response includes 'pagination' field, use the provided next_call\
    \ to get additional pages."
- name: get_transaction_info
  description: "Get comprehensive transaction information.\n    Unlike standard eth_getTransactionByHash,\
    \ this tool returns enriched data including decoded input parameters, detailed token transfers with\
    \ token metadata, transaction fee breakdown (priority fees, burnt fees) and categorized transaction\
    \ types.\n    By default, the raw transaction input is omitted if a decoded version is available to\
    \ save context; request it with `include_raw_input=True` only when you truly need the raw hex data.\n\
    \    Essential for transaction analysis, debugging smart contract interactions, tracking DeFi operations."
- name: get_chains_list
  description: "Get supported blockchain chains with their chain IDs.\n\n    Ethereum Mainnet is `chain_id`\
    \ `1`; use this tool to resolve any other chain.\n    Use this when another tool needs a supported\
    \ `chain_id` and only the chain name,\n    ecosystem, or native currency is known. Prefer a narrow\
    \ `query` to avoid returning\n    the full registry to the agent. Do not rely on partial numeric chain\
    \ ID queries such\n    as `1`, because matching is substring-based and may return many chains."
- name: direct_api_call
  description: "Call a raw Blockscout API endpoint for advanced or chain-specific data.\n\n    Before\
    \ the first call to this tool in a session, read\n    `blockscout-mcp://skill/SKILL.md` (the operating\
    \ rules), then\n    `blockscout-mcp://skill/references/blockscout-api-index.md` (the authoritative\n\
    \    index of callable endpoints); skip both reads only if this skill content is\n    already in context.\
    \ Recalled Blockscout API knowledge is not a substitute:\n    endpoint paths, parameters, and response\
    \ shapes vary across Blockscout\n    versions and per-chain deployments.\n\n    Supports POST requests\
    \ with a JSON body for endpoints like JSON RPC.\n\n    **SUPPORTS PAGINATION**: If response includes\
    \ 'pagination' field,\n    use the provided next_call to get additional pages (GET only)."
