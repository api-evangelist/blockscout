server:
  name: blockscout
  description: Blockscout operates a public remote MCP server wrapping the Blockscout block-explorer APIs
    for agents, spanning EVM chains via a single endpoint. No authentication is required to initialize
    or to enumerate tools. The server instructs callers to load the companion `blockscout-analysis` agent
    skill before making tool calls, which carries the operating rules and the curated `direct_api_call`
    endpoint reference.
  transport: streamable-http
  url: https://mcp.blockscout.com/mcp
  implementation: blockscout-mcp-server
  version: 1.26.0
