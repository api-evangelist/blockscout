specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Blockscout
providerId: blockscout
created: '2026-05-08'
modified: '2026-05-08'
reconciled: false
tags:
  - Web3
  - Explorer
  - EVM
  - Plans
description: >-
  Blockscout's hosted PRO API on dev.blockscout.com publishes a credit-based plan ladder. The
  individual chain explorer instances are free and open source for self-hosters. Pricing-page
  details were not directly accessible during research; figures reflect long-published tiers.
notes: PRO API pricing partially reconciled - dev.blockscout.com/pricing not directly accessible
  during this run.
sources:
  - https://docs.blockscout.com/devs/apis
  - https://dev.blockscout.com/pricing
plans:
  - id: blockscout-self-host
    name: Self-host (OSS)
    type: open
    description: Free, open source - self-host Blockscout for any EVM chain.
    entries:
      - label: Subscription
        name: oss_subscription
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: AGPL-3.0
      - name: Self-operated
  - id: blockscout-pro-free
    name: PRO Free
    type: freemium
    description: Free hosted PRO tier with limited credits per month.
    entries:
      - label: Monthly subscription
        name: pro_free_monthly
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Limited credit allowance
      - name: All chains supported
  - id: blockscout-pro-paid
    name: PRO Paid
    type: subscription
    description: Paid PRO tiers with progressively larger credit allowances and rate caps.
    entries:
      - label: Custom pricing
        name: pro_custom
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: Larger credit allowance
      - name: Higher rate cap
  - id: blockscout-explorer-as-a-service
    name: Explorer as a Service
    type: enterprise
    description: Managed instance hosting for an organization's chain.
    entries:
      - label: Custom pricing
        name: eaas_custom
        type: subscription
        metric: contract
        limit: -1
        timeFrame: contract
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: Managed hosted instance
      - name: SLA, uptime
